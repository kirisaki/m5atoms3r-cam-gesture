name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_SANITIZERS=ON
      - name: Build host tests and replay
        run: cmake --build build/host --parallel 2
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
      - name: Check recording tool syntax
        run: python3 -m py_compile tools/record.py

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [atoms3r-cam, atoms3r-receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
