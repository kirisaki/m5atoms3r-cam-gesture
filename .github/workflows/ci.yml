name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore windows/GestureControl.Cli --locked-mode
      - run: dotnet restore windows/GestureControl.Tests --locked-mode
      - run: dotnet build windows/GestureControl.Cli --no-restore
      - run: dotnet run --project windows/GestureControl.Tests --no-restore

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_SANITIZERS=ON
      - name: Build host tests and replay
        run: cmake --build build/host --parallel 2
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
      - name: Check recording tool syntax
        run: python3 -m py_compile tools/record.py tools/record_hands.py tools/snapshot_hand.py tools/burst_hands.py tools/measure_flow.py
      - name: Test burst recording validation
        run: python3 -m unittest discover -s tools -p 'test_burst_hands.py'

  hand-detect-eval:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build hand detection evaluation
        shell: bash
        working-directory: experiments/hand-detect
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [atoms3r-cam, atoms3r-cam-measure, atoms3r-cam-fast, atoms3r-cam-fast-hid, atoms3r-cam-fast-crop, atoms3r-cam-fast-crop-hid, atoms3r-receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
