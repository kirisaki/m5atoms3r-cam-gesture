[platformio]
default_envs = atoms3r-cam

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

[env:atoms3r-cam]
; TinyUSB CDC needs DTR asserted for diagnostic output.
monitor_dtr = 1
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
build_src_filter =
    -<*>
    +<main.cpp>
    +<camera_app.cpp>
    +<camera_console.cpp>
    +<camera_capture.cpp>
    +<gesture_i2c.cpp>

[env:atoms3r-cam-measure]
extends = env:atoms3r-cam
build_flags =
    ${env:atoms3r-cam.build_flags}
    -DGESTURE_MEASUREMENT_ONLY=1

[env:atoms3r-cam-fast]
extends = env:atoms3r-cam-measure
build_flags =
    ${env:atoms3r-cam-measure.build_flags}
    -DGESTURE_MIN_SPEED_PPS=40

[env:atoms3r-cam-fast-hid]
extends = env:atoms3r-cam
build_flags =
    ${env:atoms3r-cam.build_flags}
    -DGESTURE_MIN_SPEED_PPS=40

[env:atoms3r-cam-fast-crop]
extends = env:atoms3r-cam-fast
build_flags =
    ${env:atoms3r-cam-fast.build_flags}
    -DGESTURE_BOTTOM_CROP_PERCENT=25

[env:atoms3r-cam-fast-crop-hid]
extends = env:atoms3r-cam-fast-hid
build_flags =
    ${env:atoms3r-cam-fast-hid.build_flags}
    -DGESTURE_BOTTOM_CROP_PERCENT=25

; Experimental up to three-leg gestures; no keyboard output, even after reset or SET.
[env:atoms3r-cam-sequence]
extends = env:atoms3r-cam-fast
build_flags =
    ${env:atoms3r-cam-fast.build_flags}
    -DGESTURE_BOTTOM_CROP_PERCENT=10
    -DGESTURE_SEQUENCE_EXPERIMENT=1

[env:atoms3r-receiver]
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.31
; The receiver needs no PSRAM; also supports the original AtomS3.
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<receiver_main.cpp>
